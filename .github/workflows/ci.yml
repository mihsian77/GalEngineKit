name: Build

on:
  push:
    branches: [ main ]
    paths:
      - 'launcher/**'
      - 'hooks/**'
      - 'patches/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mingw:
    name: Build (MinGW ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: i686
            triplet: i686-w64-mingw32
            bitness: 32
          - arch: x86_64
            triplet: x86_64-w64-mingw32
            bitness: 64

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install MinGW-w64
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake ninja-build

    - name: Configure (launcher)
      working-directory: launcher
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=${{ matrix.triplet }}-gcc \
          -DCMAKE_CXX_COMPILER=${{ matrix.triplet }}-g++ \
          -DCMAKE_RC_COMPILER=${{ matrix.triplet }}-windres \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build (launcher)
      working-directory: launcher
      run: cmake --build build --parallel

    - name: Configure (hooks)
      working-directory: hooks
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=${{ matrix.triplet }}-gcc \
          -DCMAKE_CXX_COMPILER=${{ matrix.triplet }}-g++ \
          -DCMAKE_RC_COMPILER=${{ matrix.triplet }}-windres \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build (hooks)
      working-directory: hooks
      run: cmake --build build --parallel

    - name: Verify artifacts
      run: |
        echo "=== Launcher ==="
        file launcher/build/bin/GalEngineKitLauncher.exe || echo "launcher exe not found"
        ls -la launcher/build/bin/
        echo "=== Hooks ==="
        file hooks/build/bin/example_hook.dll || echo "hook dll not found"
        ls -la hooks/build/bin/

    - name: Upload launcher
      uses: actions/upload-artifact@v4
      with:
        name: GalEngineKitLauncher-${{ matrix.bitness }}bit
        path: launcher/build/bin/GalEngineKitLauncher.exe

    - name: Upload hooks
      uses: actions/upload-artifact@v4
      with:
        name: example_hook-${{ matrix.bitness }}bit
        path: hooks/build/bin/example_hook.dll

  # 回归测试：只跑不依赖系统字体的用例。
  # test_font_hook / test_version_proxy 要求前缀里真有 "Microsoft YaHei"，
  # 靠注册表造假绿没有意义，留在本地 Windows 环境跑；见 hooks/README.md
  test-wine:
    name: Tests (Wine 32-bit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 装依赖
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          mingw-w64 cmake ninja-build xvfb wine wine32:i386 fonts-droid-fallback

    - name: 构建（32 位，带测试）
      run: |
        cmake -B build/launcher -S launcher -G Ninja \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
          -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres \
          -DCMAKE_BUILD_TYPE=Release -DGEK_BUILD_TESTS=ON
        cmake --build build/launcher --parallel

        cmake -B build/hooks -S hooks -G Ninja \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
          -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres \
          -DCMAKE_BUILD_TYPE=Release -DGEK_BUILD_TESTS=ON
        cmake --build build/hooks --parallel

    - name: 初始化 Wine 前缀
      env:
        WINEPREFIX: ${{ github.workspace }}/.wine-gek
        WINEARCH: win32
        WINEDEBUG: -all
        WINEDLLOVERRIDES: mscoree,mshtml=
      run: |
        xvfb-run -a wineboot -i || true
        sleep 3

    - name: 部署冒烟（--deploy / --undeploy）
      env:
        WINEPREFIX: ${{ github.workspace }}/.wine-gek
        WINEARCH: win32
      run: |
        FIX=/tmp/deploy-fixture
        rm -rf $FIX && mkdir -p $FIX
        cp build/launcher/bin/GalEngineKitLauncher.exe $FIX/game.exe
        cp build/hooks/bin/krkr2_hook.dll $FIX/krkr2_hook-32bit.dll
        cp build/hooks/bin/version.dll $FIX/version-32bit.dll
        # 预置一个同名 version.dll，验证备份与还原
        echo "notepad placeholder" > $FIX/version.dll
        set +e
        xvfb-run -a wine ${{ github.workspace }}/build/launcher/bin/GalEngineKitLauncher.exe --deploy $FIX > /tmp/deploy.log 2>&1
        RC=$?
        set -e
        echo "== deploy exit=$RC =="; cat /tmp/deploy.log
        if [ $RC -ne 0 ]; then echo "deploy 失败"; exit 1; fi
        test -f $FIX/krkr2_hook.dll || { echo "缺 krkr2_hook.dll"; exit 1; }
        test -f $FIX/version.dll || { echo "缺 version.dll"; exit 1; }
        test -f $FIX/version.dll.gek-bak || { echo "原 version.dll 没备份"; exit 1; }
        test -f $FIX/krkr2_font.ini || { echo "缺 krkr2_font.ini"; exit 1; }
        test -f $FIX/.galenginekit-manifest.txt || { echo "缺部署记录"; exit 1; }

        set +e
        xvfb-run -a wine ${{ github.workspace }}/build/launcher/bin/GalEngineKitLauncher.exe --undeploy $FIX > /tmp/undeploy.log 2>&1
        RC=$?
        set -e
        echo "== undeploy exit=$RC =="; cat /tmp/undeploy.log
        if [ $RC -ne 0 ]; then echo "undeploy 失败"; exit 1; fi
        test ! -f $FIX/krkr2_hook.dll || { echo "krkr2_hook.dll 没删掉"; exit 1; }
        test ! -f $FIX/krkr2_font.ini || { echo "krkr2_font.ini 没删掉"; exit 1; }
        grep -q "notepad placeholder" $FIX/version.dll || { echo "version.dll 没还原"; exit 1; }
        test ! -f $FIX/.galenginekit-manifest.txt || { echo "部署记录没删"; exit 1; }

    - name: 跑回归测试
      env:
        WINEPREFIX: ${{ github.workspace }}/.wine-gek
        WINEARCH: win32
      run: |
        wine --version || true
        ls -la build/launcher/test_patch_library.exe build/hooks/bin/test_font_clone.exe

        set +e
        xvfb-run -a wine build/launcher/test_patch_library.exe > /tmp/t-patch.log 2>&1
        RC1=$?
        echo "== 补丁库 exit=$RC1 =="; cat /tmp/t-patch.log
        set -e

    - name: 体检冒烟（--doctor）
      env:
        WINEPREFIX: ${{ github.workspace }}/.wine-gek
        WINEARCH: win32
      run: |
        FIX=/tmp/doctor-fixture
        rm -rf $FIX && mkdir -p $FIX
        cp build/launcher/bin/GalEngineKitLauncher.exe $FIX/game.exe
        # 容器里没有雅黑，指定一个确实装了的字体，避免体检误报致命
        printf '[Font]\r\nTargetFont=Droid Sans Fallback\r\n' > $FIX/krkr2_font.ini
        cd $FIX
        set +e
        xvfb-run -a wine ${{ github.workspace }}/build/launcher/bin/GalEngineKitLauncher.exe --doctor > /tmp/doctor.log 2>&1
        RC=$?
        set -e
        echo "== doctor exit=$RC =="
        cat /tmp/doctor.log
        if [ $RC -ne 0 ]; then echo "doctor 返回非零"; exit 1; fi
        if [ ! -f $FIX/doctor.txt ]; then echo "doctor.txt 没有生成"; exit 1; fi
        grep -q "程序位数" doctor.txt || { echo "报告缺少位数检查"; exit 1; }
        grep -q "结论" doctor.txt || { echo "报告缺少结论段"; exit 1; }

        set +e
        FONT=$(ls /usr/share/fonts/truetype/droid/*.ttf | head -1)
        xvfb-run -a wine build/hooks/bin/test_font_clone.exe "Z:$FONT" > /tmp/t-clone.log 2>&1
        RC2=$?
        echo "== 字体克隆 exit=$RC2 =="; cat /tmp/t-clone.log
        set -e

        if [ $RC1 -ne 0 ]; then echo "补丁库测试退出码 $RC1"; exit 1; fi
        grep -q "全部通过" /tmp/t-patch.log
        if [ $RC2 -ne 0 ]; then echo "字体克隆测试退出码 $RC2"; exit 1; fi
        grep -q "全部通过" /tmp/t-clone.log
