name: Build

on:
  push:
    branches: [ main ]
    paths:
      - 'launcher/**'
      - 'hooks/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mingw:
    name: Build (MinGW ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: i686
            triplet: i686-w64-mingw32
            bitness: 32
          - arch: x86_64
            triplet: x86_64-w64-mingw32
            bitness: 64

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install MinGW-w64
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake ninja-build

    - name: Configure (launcher)
      working-directory: launcher
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=${{ matrix.triplet }}-gcc \
          -DCMAKE_CXX_COMPILER=${{ matrix.triplet }}-g++ \
          -DCMAKE_RC_COMPILER=${{ matrix.triplet }}-windres \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build (launcher)
      working-directory: launcher
      run: cmake --build build --parallel

    - name: Configure (hooks)
      working-directory: hooks
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=${{ matrix.triplet }}-gcc \
          -DCMAKE_CXX_COMPILER=${{ matrix.triplet }}-g++ \
          -DCMAKE_RC_COMPILER=${{ matrix.triplet }}-windres \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build (hooks)
      working-directory: hooks
      run: cmake --build build --parallel

    - name: Verify artifacts
      run: |
        echo "=== Launcher ==="
        file launcher/build/bin/GalEngineKitLauncher.exe || echo "launcher exe not found"
        ls -la launcher/build/bin/
        echo "=== Hooks ==="
        file hooks/build/bin/example_hook.dll || echo "hook dll not found"
        ls -la hooks/build/bin/

    - name: Upload launcher
      uses: actions/upload-artifact@v4
      with:
        name: GalEngineKitLauncher-${{ matrix.bitness }}bit
        path: launcher/build/bin/GalEngineKitLauncher.exe

    - name: Upload hooks
      uses: actions/upload-artifact@v4
      with:
        name: example_hook-${{ matrix.bitness }}bit
        path: hooks/build/bin/example_hook.dll
